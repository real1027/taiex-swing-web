"";var eq=cap+L.realized;tile(A,"初始金額","NT$ "+f0(cap));tile(A,"已實現損益","NT$ "+sg(L.realized),L.realized>0?"g":L.realized<0?"r":"");tile(A,"淨值（不含浮動）","NT$ "+f0(eq));tile(A,"持有口數",L.qty+" 口"); $("hold").textContent=Object.keys(L.positions).filter(function(m){return L.positions[m].qty>0}).map(function(m){var p=L.positions[m];return m+"："+p.qty+" 口 @ "+p.avg.toFixed(1)+(px?"　浮動 "+sg((px-p.avg)*p.qty*10-p.open):"")}).join("　｜　")||"目前空手"; if(!$("mo").value)$("mo").value=g["近月合約"]||""; var t=$("sig");t.textContent="";["20SMA / 60SMA","ATR (20)","近月合約","近月到期日","建議換月日","帳戶淨值 (NT$)"].forEach(function(n){var v=g[n];if(v===undefined)return;if(typeof v==="number")v=v.toLocaleString();var r=document.createElement("tr");r.appendChild(td(n));r.appendChild(td(v,"n"));t.appendChild(r)}); var T=$("tr");T.textContent="";var hd=document.createElement("tr");["#","時間","動作","月份","口數","價格","單筆淨損益","累計"].forEach(function(x,i){var e=document.createElement("th");e.textContent=x;if(i>3)e.className="n";hd.appendChild(e)});T.appendChild(hd); L.trades.slice().reverse().forEach(function(x){var r=document.createElement("tr");r.appendChild(td(x.id));r.appendChild(td(x.time));r.appendChild(td(x.action));r.appendChild(td(x.month));r.appendChild(td(x.qty,"n"));r.appendChild(td(f0(x.price),"n"));  r.appendChild(td(x.status!=="ok"?x.status:x.real==null?"-":sg(x.real),"n "+(x.real>0?"g":x.real<0?"r":"")));r.appendChild(td(x.status==="ok"?f0(x.cum):"","n"));T.appendChild(r)})}TK=getTk();if(TK&&API)start();else $("login").style.display="block";</script></body></html>
